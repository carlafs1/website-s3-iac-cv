<svg width="680" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Fluxo do ambiente ativo</title>
<desc>Fluxo de requisição quando o site já está provisionado: conteúdo servido via Cloudflare e S3, enquanto em paralelo a Lambda atualiza DynamoDB e reagenda o EventBridge.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .th  { font-size: 14px; font-weight: 500; }
    .ts  { font-size: 12px; font-weight: 400; fill: #5f5e5a; }
    .zl  { font-size: 12px; fill: #888780; }
  </style>
</defs>

<!-- zona efêmera -->
<rect x="40" y="40" width="600" height="116" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="zl" x="60" y="60" style="fill:#712B13">Infraestrutura efêmera</text>

<!-- zona permanente -->
<rect x="40" y="176" width="600" height="144" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="zl" x="60" y="196">Bootstrap permanente</text>

<!-- usuário -->
<rect x="56" y="64" width="100" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="106" y="86" text-anchor="middle" dominant-baseline="central" fill="#444441">Usuário</text>

<!-- cloudflare -->
<rect x="196" y="64" width="120" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="256" y="80" text-anchor="middle" dominant-baseline="central" fill="#444441">Cloudflare</text>
<text class="ts" x="256" y="98" text-anchor="middle" dominant-baseline="central">DNS · proxy</text>

<!-- S3 -->
<rect x="364" y="64" width="120" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="424" y="80" text-anchor="middle" dominant-baseline="central" fill="#712B13">S3</text>
<text class="ts" x="424" y="98" text-anchor="middle" dominant-baseline="central" style="fill:#993C1D">Conteúdo servido</text>

<line x1="156" y1="86" x2="196" y2="86" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="316" y1="86" x2="364" y2="86" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<!-- resposta ao usuário -->
<path d="M 484 86 L 524 86 L 524 140 L 106 140 L 106 108" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="156" text-anchor="middle">conteúdo servido ao usuário</text>

<!-- lambda controle -->
<rect x="56" y="204" width="160" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="136" y="220" text-anchor="middle" dominant-baseline="central" fill="#3C3489">λ Controle</text>
<text class="ts" x="136" y="238" text-anchor="middle" dominant-baseline="central" style="fill:#534AB7">Em paralelo</text>

<!-- dynamodb -->
<rect x="260" y="204" width="160" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="340" y="220" text-anchor="middle" dominant-baseline="central" fill="#3C3489">DynamoDB</text>
<text class="ts" x="340" y="238" text-anchor="middle" dominant-baseline="central" style="fill:#534AB7">Atualiza timestamp</text>

<!-- eventbridge -->
<rect x="464" y="204" width="148" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="538" y="220" text-anchor="middle" dominant-baseline="central" fill="#712B13">EventBridge</text>
<text class="ts" x="538" y="238" text-anchor="middle" dominant-baseline="central" style="fill:#993C1D">Reagenda timer</text>

<!-- cloudflare → lambda (paralelo) -->
<path d="M 256 108 L 256 170 L 136 170 L 136 204" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<line x1="216" y1="226" x2="260" y2="226" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M 216 238 L 240 260 L 464 260 L 464 248" fill="none" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>

<text class="ts" x="340" y="310" text-anchor="middle">A cada acesso o timer é reiniciado — ambiente ativo enquanto houver uso</text>

</svg>
