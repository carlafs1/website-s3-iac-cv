<svg width="860" viewBox="0 0 860 900" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Arquitetura do website efêmero serverless</title>
<desc>Diagrama completo mostrando camada permanente, CI/CD e infraestrutura efêmera com fluxos de requisição, provisionamento e destruição.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .th  { font-size: 14px; font-weight: 500; fill: #2c2c2a; }
    .ts  { font-size: 12px; font-weight: 400; fill: #5f5e5a; }
    .zone-label { font-size: 12px; font-weight: 400; fill: #888780; }
    .note { font-size: 11px; fill: #712b13; }
    .leg  { font-size: 12px; fill: #2c2c2a; }
  </style>
</defs>

<!-- ═══ ZONA PERMANENTE ═══ -->
<rect x="40" y="40" width="780" height="300" rx="16" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="zone-label" x="64" y="64">Bootstrap permanente</text>

<!-- Usuário -->
<rect x="374" y="52" width="112" height="36" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="430" y="70" text-anchor="middle" dominant-baseline="central">Usuário</text>

<!-- Cloudflare -->
<rect x="354" y="104" width="152" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="430" y="120" text-anchor="middle" dominant-baseline="central">Cloudflare</text>
<text class="ts" x="430" y="138" text-anchor="middle" dominant-baseline="central">DNS · proxy · borda</text>

<!-- API Gateway -->
<rect x="354" y="166" width="152" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="430" y="180" text-anchor="middle" dominant-baseline="central" fill="#3C3489">API Gateway</text>
<text class="ts" x="430" y="198" text-anchor="middle" dominant-baseline="central" style="fill:#534AB7">Entrada permanente</text>

<!-- Lambda Controle -->
<rect x="334" y="228" width="192" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="430" y="244" text-anchor="middle" dominant-baseline="central" fill="#3C3489">λ Controle</text>
<text class="ts" x="430" y="262" text-anchor="middle" dominant-baseline="central" style="fill:#534AB7">Lifecycle · segurança</text>

<!-- DynamoDB -->
<rect x="80" y="248" width="172" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="166" y="264" text-anchor="middle" dominant-baseline="central" fill="#3C3489">DynamoDB</text>
<text class="ts" x="166" y="282" text-anchor="middle" dominant-baseline="central" style="fill:#534AB7">Estado · nome do bucket</text>

<!-- SNS -->
<rect x="600" y="248" width="100" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="650" y="264" text-anchor="middle" dominant-baseline="central" fill="#3C3489">SNS</text>
<text class="ts" x="650" y="282" text-anchor="middle" dominant-baseline="central" style="fill:#534AB7">Alertas</text>

<!-- SSM -->
<rect x="716" y="248" width="84" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="758" y="270" text-anchor="middle" dominant-baseline="central" fill="#3C3489">SSM</text>

<!-- Setas zona permanente -->
<line x1="430" y1="88" x2="430" y2="104" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="430" y1="148" x2="430" y2="166" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="430" y1="210" x2="430" y2="228" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="334" y1="254" x2="252" y2="262" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="252" y1="256" x2="334" y2="248" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="526" y1="254" x2="600" y2="264" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="526" y1="260" x2="716" y2="268" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>

<!-- ═══ ZONA CI/CD ═══ -->
<rect x="240" y="386" width="380" height="96" rx="16" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="zone-label" x="264" y="406" style="fill:#085041">CI/CD</text>

<rect x="256" y="414" width="152" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="332" y="430" text-anchor="middle" dominant-baseline="central" fill="#085041">GitHub Actions</text>
<text class="ts" x="332" y="448" text-anchor="middle" dominant-baseline="central" style="fill:#0F6E56">apply · destroy · OIDC</text>

<rect x="452" y="414" width="152" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="528" y="430" text-anchor="middle" dominant-baseline="central" fill="#085041">Terraform</text>
<text class="ts" x="528" y="448" text-anchor="middle" dominant-baseline="central" style="fill:#0F6E56">IaC · apply · destroy</text>

<line x1="408" y1="436" x2="452" y2="436" stroke="#1D9E75" stroke-width="1" marker-end="url(#arrow)"/>

<!-- λ → CI/CD -->
<line x1="430" y1="272" x2="430" y2="386" stroke="#534AB7" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<text class="ts" x="442" y="334" style="fill:#534AB7">dispara workflow</text>

<!-- ═══ ZONA EFÊMERA ═══ -->
<rect x="40" y="530" width="780" height="196" rx="16" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="zone-label" x="64" y="552" style="fill:#712B13">Infraestrutura efêmera</text>

<!-- S3 -->
<rect x="80" y="572" width="180" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="170" y="592" text-anchor="middle" dominant-baseline="central" fill="#712B13">S3</text>
<text class="ts" x="170" y="612" text-anchor="middle" dominant-baseline="central" style="fill:#993C1D">Conteúdo estático</text>

<!-- λ registro_bucket -->
<rect x="300" y="572" width="200" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="400" y="592" text-anchor="middle" dominant-baseline="central" fill="#712B13">λ registro_bucket</text>
<text class="ts" x="400" y="612" text-anchor="middle" dominant-baseline="central" style="fill:#993C1D">Salva bucket · limpa temp</text>

<!-- EventBridge -->
<rect x="540" y="572" width="240" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="660" y="592" text-anchor="middle" dominant-baseline="central" fill="#712B13">EventBridge</text>
<text class="ts" x="660" y="612" text-anchor="middle" dominant-baseline="central" style="fill:#993C1D">Timer de inatividade</text>

<!-- Terraform → efêmera -->
<line x1="430" y1="482" x2="430" y2="530" stroke="#1D9E75" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="442" y="510" style="fill:#0F6E56">provisiona</text>

<!-- λ registro → DynamoDB -->
<path d="M 400 572 L 400 540 L 166 540 L 166 292" fill="none" stroke="#D85A30" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="240" y="536" style="fill:#993C1D">registra nome do bucket</text>

<!-- EventBridge → λ Controle -->
<path d="M 660 572 L 660 360 L 500 272" fill="none" stroke="#D85A30" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="624" y="430" style="fill:#993C1D">verifica timeout</text>

<!-- Resposta ao usuário -->
<path d="M 80 590 L 40 590 L 40 70 L 374 70" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="28" y="340" text-anchor="middle" transform="rotate(-90,28,340)" style="fill:#5F5E5A">conteúdo servido</text>

<!-- ═══ FAIXA DESTRUIÇÃO ═══ -->
<rect x="40" y="744" width="780" height="36" rx="8" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="note" x="430" y="766" text-anchor="middle">inatividade detectada → terraform destroy → S3 + EventBridge removidos → custo operacional zerado</text>

<!-- ═══ LEGENDA ═══ -->
<line x1="48" y1="820" x2="80" y2="820" stroke="#534AB7" stroke-width="1"/>
<text class="leg" x="88" y="824">requisição</text>
<line x1="200" y1="820" x2="232" y2="820" stroke="#888780" stroke-width="1" stroke-dasharray="4 3"/>
<text class="leg" x="240" y="824">resposta</text>
<line x1="330" y1="820" x2="362" y2="820" stroke="#D85A30" stroke-width="1" stroke-dasharray="4 3"/>
<text class="leg" x="370" y="824">evento / trigger</text>
<line x1="490" y1="820" x2="522" y2="820" stroke="#1D9E75" stroke-width="1"/>
<text class="leg" x="530" y="824">provisionamento</text>

</svg>
