<svg width="680" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Fluxo de inatividade e destruição automática</title>
<desc>Sequência de destruição: EventBridge expira, Lambda valida timeout, GitHub Actions dispara destroy, recursos efêmeros são removidos e ambiente retorna ao estado inicial.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .th  { font-size: 14px; font-weight: 500; }
    .ts  { font-size: 12px; font-weight: 400; fill: #5f5e5a; }
    .zl  { font-size: 12px; fill: #888780; }
    .note { font-size: 11px; fill: #712b13; }
  </style>
</defs>

<!-- zona efêmera -->
<rect x="40" y="40" width="600" height="80" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="zl" x="60" y="60" style="fill:#712B13">Infraestrutura efêmera</text>

<!-- zona permanente -->
<rect x="40" y="144" width="600" height="100" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="zl" x="60" y="164">Bootstrap permanente</text>

<!-- zona cicd -->
<rect x="40" y="268" width="600" height="100" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="zl" x="60" y="288" style="fill:#085041">CI/CD</text>

<!-- eventbridge -->
<rect x="240" y="60" width="200" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="340" y="76" text-anchor="middle" dominant-baseline="central" fill="#712B13">EventBridge</text>
<text class="ts" x="340" y="94" text-anchor="middle" dominant-baseline="central" style="fill:#993C1D">Timer expira</text>

<!-- lambda controle -->
<rect x="56" y="172" width="160" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="136" y="188" text-anchor="middle" dominant-baseline="central" fill="#3C3489">λ Controle</text>
<text class="ts" x="136" y="206" text-anchor="middle" dominant-baseline="central" style="fill:#534AB7">Valida timeout</text>

<!-- dynamodb -->
<rect x="260" y="172" width="180" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="350" y="188" text-anchor="middle" dominant-baseline="central" fill="#3C3489">DynamoDB</text>
<text class="ts" x="350" y="206" text-anchor="middle" dominant-baseline="central" style="fill:#534AB7">Confirma: ocioso</text>

<!-- sns -->
<rect x="488" y="172" width="132" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="554" y="188" text-anchor="middle" dominant-baseline="central" fill="#3C3489">SNS</text>
<text class="ts" x="554" y="206" text-anchor="middle" dominant-baseline="central" style="fill:#534AB7">Alerta enviado</text>

<!-- setas permanente -->
<line x1="340" y1="104" x2="340" y2="140" stroke="#993C1D" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<path d="M 340 168 L 340 158 L 136 158 L 136 172" fill="none" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="216" y1="194" x2="260" y2="194" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="440" y1="194" x2="488" y2="194" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>

<!-- github actions -->
<rect x="56" y="296" width="172" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="142" y="312" text-anchor="middle" dominant-baseline="central" fill="#085041">GitHub Actions</text>
<text class="ts" x="142" y="330" text-anchor="middle" dominant-baseline="central" style="fill:#0F6E56">destroy.yml</text>

<!-- terraform -->
<rect x="272" y="296" width="172" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="358" y="312" text-anchor="middle" dominant-baseline="central" fill="#085041">Terraform</text>
<text class="ts" x="358" y="330" text-anchor="middle" dominant-baseline="central" style="fill:#0F6E56">terraform destroy</text>

<path d="M 136 216 L 136 262 L 142 262 L 142 296" fill="none" stroke="#534AB7" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="186" y="258" text-anchor="start">ocioso → dispara destroy</text>
<line x1="228" y1="318" x2="272" y2="318" stroke="#1D9E75" stroke-width="1" marker-end="url(#arrow)"/>

<!-- resultado final -->
<rect x="40" y="392" width="600" height="48" rx="12" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="340" y="410" text-anchor="middle" dominant-baseline="central" fill="#712B13">S3 · EventBridge destruídos</text>
<text class="ts" x="340" y="430" text-anchor="middle" dominant-baseline="central" style="fill:#993C1D">DynamoDB: estado offline · custo operacional zerado</text>

<line x1="358" y1="340" x2="358" y2="392" stroke="#1D9E75" stroke-width="1" marker-end="url(#arrow)"/>

</svg>
