<svg width="680" viewBox="0 0 680 580" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Fluxo do primeiro acesso</title>
<desc>Sequência completa do primeiro acesso quando o ambiente está offline: requisição, validação, disparo do apply, criação dos recursos e registro do bucket no DynamoDB.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .th  { font-size: 14px; font-weight: 500; }
    .ts  { font-size: 12px; font-weight: 400; fill: #5f5e5a; }
    .zl  { font-size: 12px; fill: #888780; }
  </style>
</defs>

<!-- zona permanente -->
<rect x="40" y="100" width="600" height="172" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="zl" x="60" y="120">Bootstrap permanente</text>

<!-- zona cicd -->
<rect x="40" y="296" width="600" height="100" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="zl" x="60" y="316" style="fill:#085041">CI/CD</text>

<!-- zona efêmera -->
<rect x="40" y="420" width="600" height="120" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="zl" x="60" y="440" style="fill:#712B13">Infraestrutura efêmera</text>

<!-- usuário -->
<rect x="56" y="40" width="100" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="106" y="62" text-anchor="middle" dominant-baseline="central" fill="#444441">Usuário</text>

<!-- cloudflare -->
<rect x="200" y="40" width="120" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="260" y="54" text-anchor="middle" dominant-baseline="central" fill="#444441">Cloudflare</text>
<text class="ts" x="260" y="72" text-anchor="middle" dominant-baseline="central">DNS · proxy</text>

<!-- api gateway -->
<rect x="364" y="40" width="136" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="432" y="54" text-anchor="middle" dominant-baseline="central" fill="#3C3489">API Gateway</text>
<text class="ts" x="432" y="72" text-anchor="middle" dominant-baseline="central" style="fill:#534AB7">Entrada permanente</text>

<line x1="156" y1="62" x2="200" y2="62" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="320" y1="62" x2="364" y2="62" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="432" y1="84" x2="432" y2="128" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>

<!-- lambda controle -->
<rect x="316" y="128" width="192" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="412" y="144" text-anchor="middle" dominant-baseline="central" fill="#3C3489">λ Controle</text>
<text class="ts" x="412" y="162" text-anchor="middle" dominant-baseline="central" style="fill:#534AB7">security.py · valida estado</text>

<!-- dynamodb -->
<rect x="80" y="128" width="192" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="176" y="144" text-anchor="middle" dominant-baseline="central" fill="#3C3489">DynamoDB</text>
<text class="ts" x="176" y="162" text-anchor="middle" dominant-baseline="central" style="fill:#534AB7">offline → provisioning</text>

<!-- html espera -->
<rect x="80" y="204" width="192" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="176" y="220" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Página de espera</text>
<text class="ts" x="176" y="238" text-anchor="middle" dominant-baseline="central" style="fill:#534AB7">Refresh automático 30s</text>

<line x1="316" y1="148" x2="272" y2="148" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M 316 162 L 290 162 L 290 226 L 272 226" fill="none" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>

<!-- github actions -->
<rect x="80" y="324" width="172" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="166" y="340" text-anchor="middle" dominant-baseline="central" fill="#085041">GitHub Actions</text>
<text class="ts" x="166" y="358" text-anchor="middle" dominant-baseline="central" style="fill:#0F6E56">apply.yml</text>

<!-- terraform -->
<rect x="296" y="324" width="172" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="382" y="340" text-anchor="middle" dominant-baseline="central" fill="#085041">Terraform</text>
<text class="ts" x="382" y="358" text-anchor="middle" dominant-baseline="central" style="fill:#0F6E56">terraform apply</text>

<path d="M 412 172 L 412 290 L 166 290 L 166 324" fill="none" stroke="#534AB7" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="310" y="286" text-anchor="middle">dispara workflow</text>
<line x1="252" y1="346" x2="296" y2="346" stroke="#1D9E75" stroke-width="1" marker-end="url(#arrow)"/>

<!-- S3 -->
<rect x="80" y="452" width="148" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="154" y="468" text-anchor="middle" dominant-baseline="central" fill="#712B13">S3</text>
<text class="ts" x="154" y="486" text-anchor="middle" dominant-baseline="central" style="fill:#993C1D">Bucket único criado</text>

<!-- EventBridge -->
<rect x="252" y="452" width="148" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="326" y="468" text-anchor="middle" dominant-baseline="central" fill="#712B13">EventBridge</text>
<text class="ts" x="326" y="486" text-anchor="middle" dominant-baseline="central" style="fill:#993C1D">Timer inicializado</text>

<!-- λ registro_bucket -->
<rect x="424" y="452" width="188" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="518" y="468" text-anchor="middle" dominant-baseline="central" fill="#712B13">λ registro_bucket</text>
<text class="ts" x="518" y="486" text-anchor="middle" dominant-baseline="central" style="fill:#993C1D">Salva bucket · limpa temp</text>

<path d="M 382 368 L 382 410 L 154 410 L 154 452" fill="none" stroke="#1D9E75" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M 382 410 L 326 410 L 326 452" fill="none" stroke="#1D9E75" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M 382 410 L 518 410 L 518 452" fill="none" stroke="#1D9E75" stroke-width="1" marker-end="url(#arrow)"/>

<path d="M 518 452 L 518 400 L 176 400 L 176 172" fill="none" stroke="#D85A30" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="360" y="396" text-anchor="middle" style="fill:#993C1D">registra bucket · estado: online</text>

</svg>
